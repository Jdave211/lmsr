[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmsr"
version = "0.1.0"
description = "A self-contained LMSR market maker: exact prices, bounded loss, property tests."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dave Jaga" }]
dependencies = []
keywords = ["lmsr", "prediction-markets", "market-maker", "scoring-rules"]
classifiers = [
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/Jdave211/lmsr"
Source = "https://github.com/Jdave211/lmsr"
Changelog = "https://github.com/Jdave211/lmsr/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["lmsr*"]

[tool.setuptools.package-data]
lmsr = ["py.typed"]
